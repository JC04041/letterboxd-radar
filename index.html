<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Radar</title>
<meta name="description" content="Top 100 filmmaker tracker, next-up predictions and personal recommendations from a Letterboxd profile.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  try { var t = localStorage.getItem('radar.theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <a class="brand" href="#/" style="text-decoration:none;color:inherit">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="16" r="2.5" fill="#fff"/></svg>
        <div style="min-width:0"><h1>Film Radar</h1><div class="who" id="who"></div></div>
      </a>
      <div class="top-actions">
        <span class="pulse" id="pulse"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle light or dark theme" title="Theme">◐</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="overview">Overview</a>
      <a href="#/top100" data-tab="top100">Top 100</a>
      <a href="#/next" data-tab="next">Next up</a>
      <a href="#/filmmaker" data-tab="filmmaker">Filmmakers</a>
      <a href="#/foryou" data-tab="foryou">For you</a>
      <a href="#/taste" data-tab="taste">Taste</a>
      <a href="#/activity" data-tab="activity">Activity</a>
    </nav>
  </div>
</header>
<main id="main"><div class="loading">Loading your radar…</div></main>
<footer id="foot"></footer>
<dialog class="modal" id="film-modal"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
